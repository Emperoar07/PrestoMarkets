name: Image backfill

# Keeps every live market imaged — and now does the work HERE rather than on the Worker.
#
# Image backfill probes candidate URLs, validates bytes, and generates AI illustrations across dozens
# of markets. That exceeds the Cloudflare Workers FREE-plan CPU ceiling, and the resulting isolate
# kill is uncatchable from JS, so the strict curl below used to turn every scheduled run red (~3/day)
# while completing little real work. A GitHub Actions runner has no CPU ceiling, so
# scripts/backfill-market-images.mjs runs the SAME src/lib/imageBackfill.ts implementation to
# completion and writes market_metadata_overrides to D1 over REST.
#
# The on-Worker route still exists for manual dispatch and agent-tick's best-effort step, bounded
# small so it does what it can within the ceiling instead of dying.
#
# Required repository secrets:
#   DOTENV_LOCAL - contents of .env.local (CF_ACCOUNT_ID + CLOUDFLARE_API_TOKEN for the D1 REST
#                  write, plus the image/RPC provider keys the pipeline uses). Written to disk at the
#                  start of the job and never echoed.

on:
  schedule:
    # 3x/day (00:10, 08:10, 16:10 UTC). Images are attached at CREATION (the agent pipeline resolves a
    # team/subject image, else a branded banner), so this lane is a periodic upgrade/repair pass for
    # the rare miss — not a hot path.
    - cron: '10 0,8,16 * * *'
  workflow_dispatch:

concurrency:
  group: image-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # The script budgets itself to 420s of processing plus a snapshot rebuild; this leaves headroom
    # for install and the chain read.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Heredoc so no secret value is interpolated into a logged command line.
      - name: Materialize environment
        run: |
          cat > .env.local <<'PRESTO_ENV_EOF'
          ${{ secrets.DOTENV_LOCAL }}
          PRESTO_ENV_EOF

      - name: Backfill missing market images
        run: node scripts/backfill-market-images.mjs

      - name: Remove environment file
        if: ${{ always() }}
        run: rm -f .env.local
