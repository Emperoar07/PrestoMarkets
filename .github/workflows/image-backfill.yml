name: Image backfill

# Keeps every live market imaged. Agent-created and legacy markets that lack a real subject image
# (or only have a branded fallback) get a resolved image within ~30 minutes, instead of waiting on
# the 2-hour agent tick. User-created markets already require an image at creation, so this lane is
# mostly about agent and legacy markets.
#
# Required GitHub Actions secrets:
#   APP_URL       - production base URL, e.g. https://presto-markets.vercel.app
#   CRON_SECRET   - matches the CRON_SECRET env var set in Vercel

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Must exceed curl's worst case (290s + 10s retry delay + 290s ≈ 590s) plus runner setup,
    # or the job kills itself mid-retry and turns red even though the endpoint resumes next tick.
    timeout-minutes: 12
    steps:
      # The endpoint self-limits to a ~220s work budget and returns partial progress, so a healthy
      # run answers well inside --max-time (it used to run past Vercel's 300s kill, which timed out
      # curl at 290s and turned EVERY scheduled run red). One retry covers a transient blip; the
      # endpoint is idempotent, and the next 30-minute run resumes wherever this one stopped.
      - name: Backfill missing market images
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/backfill-market-images" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" \
            --max-time 290 --retry 1 --retry-delay 10 --retry-all-errors \
            --fail-with-body
