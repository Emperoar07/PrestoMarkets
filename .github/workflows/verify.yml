name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Match the Node/npm that generates package-lock.json (npm 11) so `npm ci` interprets
          # optional native deps (utf-8-validate/bufferutil) identically and stays in sync.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

      - name: Test contracts
        run: npm run test:contracts
