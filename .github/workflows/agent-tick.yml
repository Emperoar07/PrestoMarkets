name: Agent tick

# Pings the Presto agent cron endpoints on a 2-hour cadence so the agent
# gets more chances per day to surface a market-worthy trend. This is now the
# SOLE scheduler for these endpoints — the redundant Vercel daily crons were
# removed (they only duplicated market-factory + auto-resolve at a lower
# cadence) to stop triple-triggering the same heavy work (and wasting RPC
# quota). Run manually any time via workflow_dispatch. The signal-threshold
# gate inside the pipeline decides whether each tick actually creates a
# market, so most ticks legitimately skip (which is the intended behavior).
#
# The agent endpoints do heavy, variable work (LLM trend research, on-chain
# seeding, image fetches) and can exceed the serverless gateway timeout while
# still completing server-side. Those steps are continue-on-error so a slow
# trigger never reds the whole tick; the lightweight leaderboard step stays
# strict as a health signal.
#
# Required GitHub Actions secrets:
#   APP_URL       - production base URL: https://presto-markets.pages.dev
#                   (the app is on Cloudflare Pages + Workers, NOT Vercel — a vercel.app value here
#                   points every cron at a dead host, and the curls just report that failure)
#   CRON_SECRET   - matches the CRON_SECRET secret bound to the Cloudflare Workers

on:
  schedule:
    # Every 2 hours, on the hour
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger market-factory cron
        continue-on-error: true
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/market-factory" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" --max-time 290

      # auto-resolve now runs on its own fast 15-minute cadence
      # (.github/workflows/auto-resolve.yml) so settlement isn't bottlenecked on this 2-hour tick.

      - name: Backfill seed any unseeded open markets
        if: ${{ always() }}
        continue-on-error: true
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/seed-open-markets" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" --max-time 290

      # Image backfill also runs on its own faster 30-minute cadence
      # (.github/workflows/image-backfill.yml). We ALSO run it here so a manual agent-tick dispatch
      # backfills images too (the step is idempotent — it skips markets that already have a good
      # image and only re-resolves blank / branded-fallback ones).
      - name: Backfill missing market images
        if: ${{ always() }}
        continue-on-error: true
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/backfill-market-images" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" --max-time 290

      - name: Record market odds snapshots
        if: ${{ always() }}
        continue-on-error: true
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/market-snapshots" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" --max-time 290

      # Sweep accrued V3 protocol fees to the treasury. Idempotent and cheap on empty ticks (just a
      # market read + per-market accruedFees read); only markets above the dust threshold are swept.
      - name: Sweep accrued protocol fees to treasury
        if: ${{ always() }}
        continue-on-error: true
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/withdraw-fees" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" --max-time 290

      # Cheap CACHE READ, not a computation. The actual leaderboard rebuild moved off-Worker to
      # .github/workflows/leaderboard.yml, because getAllAccountStats() blows the Workers Free-plan
      # CPU ceiling and that kill is uncatchable — which is why this step, the only one here without
      # continue-on-error, used to fail the whole job on every 2-hourly run. Now it just reads
      # leaderboard_cache and reports row count + staleness, so it is safe to keep STRICT: if this
      # goes red, something is genuinely wrong (bad deploy, D1 unreachable) and is worth an alert.
      - name: Check forecaster leaderboard freshness
        if: ${{ always() }}
        run: |
          curl -sS -X GET "${{ secrets.APP_URL }}/api/cron/leaderboard" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" \
            --max-time 290 --retry 2 --retry-delay 15 --retry-all-errors \
            --fail-with-body
